<!DOCTYPE html>

<style>

  margin:0;
  background:#000;

.box{
  border:2px solid gold;

h1{

}
.profile-text{
  background:#111;
  border:1px solid #333;
  border-radius:15px;
  padding:12px;
  margin:15px 8px;
  font-size:16px;
  line-height:23px;
}

.btn{
  display:block;

  padding:16px;
  border-radius:35px;
  font-size:19px;
  font-weight:bold;
  text-decoration:none;
  color:#000;

.gold{background:gold; box-shadow:0 0 18px gold;}
.green{background:#00ff88; box-shadow:0 0 18px #00ff88;}
